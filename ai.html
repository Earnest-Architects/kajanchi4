<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AIレンダリング — Kajanchi</title>
<style>
:root{--bg:#0b0f18;--panel:rgba(14,19,30,.78);--ink:#eef1f7;--mute:#9aa4b8;--line:rgba(255,255,255,.18);--accent:#e0a447;--err:#ff8a80}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hiragino Sans","Yu Gothic","Noto Sans JP","Segoe UI",system-ui,sans-serif}
.hero{position:relative;height:100vh;height:100dvh;background:#000;overflow:hidden}
#cap{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
#capEmpty{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);text-align:center;padding:24px}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:8px;padding:12px;z-index:3;pointer-events:none}
.top>*{pointer-events:auto}
.chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);backdrop-filter:blur(8px);color:var(--ink);font:inherit;font-size:.85rem;cursor:pointer}
.panel{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;z-index:3}
.ref{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.drop{position:relative;width:64px;height:64px;flex:none;border:2px dashed var(--accent);border-radius:10px;display:grid;place-items:center;text-align:center;color:var(--mute);font-size:.7rem;line-height:1.2;cursor:pointer;overflow:hidden}
.drop.has{border-style:solid;border-color:var(--line)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop input{display:none}
.drop.over{background:rgba(255,255,255,.12)}
.ref small{color:var(--mute)}
textarea{width:100%;min-height:76px;max-height:30vh;resize:vertical;padding:10px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.35);color:inherit;font:inherit}
textarea:focus,button:focus-visible,.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.go{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#1a1205;font:inherit;font-weight:700;cursor:pointer}
button.go:disabled{opacity:.55;cursor:wait}
#status{margin-top:8px;font-size:.85rem;color:var(--mute);min-height:1.2em}
#status.err{color:var(--err)}
#set{position:absolute;top:56px;right:12px;z-index:4;width:min(360px,calc(100% - 24px));background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;padding:12px;display:none;font-size:.85rem}
#set.open{display:block}
#set input{display:block;width:100%;padding:8px;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.35);color:inherit}
#conn{margin-top:8px}#conn.ok{color:#7ddc87}#conn.bad{color:var(--err)}
.grp{display:flex;gap:8px;flex-wrap:wrap}
.panel.hide{display:none}
#cmp{position:absolute;display:none;z-index:1;touch-action:none;cursor:ew-resize;user-select:none;-webkit-user-select:none}
#cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;-webkit-user-drag:none}
#cmpB{clip-path:inset(0 0 0 var(--pos,50%))}
#bar{position:absolute;top:0;bottom:0;left:var(--pos,50%);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.7);pointer-events:none}
#knob{position:absolute;top:50%;left:var(--pos,50%);width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:15px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.55);cursor:ew-resize}
#knob:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.tag{position:absolute;top:64px;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.55);font-size:.75rem;pointer-events:none}
.acts{position:absolute;right:calc(14px + env(safe-area-inset-right,0px) + var(--hist-w,0px));bottom:calc(var(--panel-h,0px) + 14px);z-index:4;display:none;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 28px - var(--hist-w,0px))}
.acts.show{display:flex}
.acts a,.acts button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:11px 18px;border-radius:999px;font:inherit;font-weight:700;font-size:.9rem;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.5);cursor:pointer}
#dl{background:var(--accent);color:#1a1205;border:0}
#use{background:var(--panel);backdrop-filter:blur(8px);color:var(--ink);border:1px solid var(--accent)}
@media(min-width:860px){.acts{bottom:14px}}
.hero.nopanel .acts{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
/* 赤ペン */
#paint{position:absolute;z-index:2;display:none;opacity:.8;pointer-events:none}
#paint.on{pointer-events:auto;touch-action:none;cursor:crosshair}
#tools{position:absolute;z-index:4;left:12px;top:calc(var(--top-h,56px) + 4px);max-width:calc(100% - 24px - var(--hist-w,0px));display:none;flex-wrap:wrap;align-items:center;gap:6px;padding:6px;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px}
#tools.show{display:flex}
#tools .chip{min-height:40px}
#tools .chip[aria-pressed="true"]{background:var(--accent);color:#1a1205;border-color:var(--accent)}
#tools .chip:disabled{opacity:.45}
.sz{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--mute);min-height:40px}
.sz input{width:110px;height:40px;margin:0;accent-color:var(--accent)}
#markinfo{display:none;margin-top:8px;font-size:.8rem;color:#ff9c9c}
/* 進捗 */
#prog{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;pointer-events:none}
#prog.show{display:flex}
.pcard{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 28px;border-radius:22px;background:rgba(8,11,18,.58);backdrop-filter:blur(8px);border:1px solid var(--line)}
.ringbox{position:relative;width:128px;height:128px}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:8}
.ringbox .bg{stroke:rgba(255,255,255,.18)}
.ringbox .fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:326.73;stroke-dashoffset:326.73}
#pct{position:absolute;inset:0;display:grid;place-items:center;font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums}
#stage{font-size:.95rem}
#el{font-size:.75rem;color:var(--mute);font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:no-preference){.ringbox .fg{transition:stroke-dashoffset .25s linear}#prog.slow .pcard{animation:pu 1.8s ease-in-out infinite}}
@keyframes pu{50%{opacity:.7}}
/* 履歴 */
#hist{position:absolute;z-index:3;right:calc(8px + env(safe-area-inset-right,0px));top:calc(var(--top-h,56px) + 4px);bottom:calc(var(--panel-h,0px) + 8px);width:78px;display:none;flex-direction:column;gap:8px;padding:8px 6px;background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px}
.hero.hopen #hist{display:flex}
.hero.hopen{--hist-w:88px}
.hero.nopanel #hist{bottom:calc(8px + env(safe-area-inset-bottom,0px))}
@media(min-width:940px){#hist{bottom:12px}}
#hlist{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.hi{position:relative;flex:none}
.ht{display:block;width:100%;padding:0;border:2px solid transparent;border-radius:8px;background:#000;cursor:pointer;overflow:hidden}
.hi.act .ht{border-color:var(--accent)}
.ht img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.hx{position:absolute;top:2px;right:2px;width:22px;height:22px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:14px;line-height:22px;cursor:pointer}
.hx::after{content:"";position:absolute;inset:-9px}
#hclr{min-height:40px;padding:6px 2px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:inherit;font-size:.66rem;cursor:pointer}
#hempty{font-size:.7rem;color:var(--mute);text-align:center;padding:6px 0}
@media(prefers-reduced-motion:no-preference){.busy{animation:p 1.2s ease-in-out infinite}}
@keyframes p{50%{opacity:.4}}
</style>
</head>

<div class="hero">
  <img id="cap" alt="360ビューのキャプチャ">
  <canvas id="paint" aria-label="赤ペンのマーク"></canvas>
  <div id="capEmpty">360ツアーから取得中です…<br>表示されない場合は「画像を変更」で画像を選んでください。</div>
  <div id="cmp" aria-label="元画像と生成結果の比較">

    <img id="cmpB" alt="生成結果">
    <span class="tag" style="left:10px">元画像</span>
    <span class="tag" style="right:10px">生成結果</span>
    <div id="bar"></div>
    <div id="knob" role="slider" tabindex="0" aria-label="比較スライダー" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">⇔</div>
  </div>
  <div class="top">
    <div class="grp">
      <button class="chip" id="back" type="button">← 戻る</button>
      <button class="chip" id="chg" type="button">画像を変更</button>
      <button class="chip" id="mark" type="button" aria-pressed="false" style="display:none">✎ マーク</button>
    </div>
    <div class="grp" style="justify-content:flex-end">
      <button class="chip" id="closecmp" type="button" style="display:none">比較を閉じる</button>
      <button class="chip" id="hbtn" type="button" aria-pressed="false">履歴</button>
      <button class="chip" id="pnl" type="button">入力パネル</button>
      <button class="chip" id="gear" type="button">接続設定</button>
    </div>
  </div>
  <div class="acts" id="acts">
    <button id="use" type="button">この結果を画像1にする</button>
    <a id="dl" download="result.png">⬇ ダウンロード</a>
  </div>
  <div id="tools" role="toolbar" aria-label="マークツール">
    <button class="chip" id="tPen" type="button" aria-pressed="true">赤ペン</button>
    <button class="chip" id="tEr" type="button" aria-pressed="false">消しゴム</button>
    <label class="sz">太さ<input id="tSize" type="range" min="4" max="80" value="20" aria-label="ペンの太さ"></label>
    <button class="chip" id="tUndo" type="button" disabled>元に戻す</button>
    <button class="chip" id="tClr" type="button" disabled>全消去</button>
    <button class="chip" id="tDone" type="button">完了</button>
  </div>
  <div id="hist" aria-label="生成履歴">
    <button id="hclr" type="button">すべて削除</button>
    <div id="hlist"></div>
    <div id="hempty">履歴なし</div>
  </div>
  <div id="prog">
    <div class="pcard">
      <div class="ringbox" id="ringbox" role="progressbar" aria-label="生成の進捗(目安)" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" id="ring" cx="60" cy="60" r="52"/></svg>
        <div id="pct" aria-hidden="true">0%</div>
      </div>
      <div id="stage" aria-live="polite"></div>
      <div id="el"></div>
    </div>
  </div>
  <input type="file" id="f1" accept="image/*" hidden>
  <div id="set">
    <input id="base" aria-label="サーバーのアドレス" placeholder="server.pyのアドレス 例: https://pc名.xxxx.ts.net / http://100.x.x.x:8080 / http://localhost:8080">
    <input id="key" type="password" aria-label="アクセスキー" placeholder="アクセスキー(PASSWORD設定時のみ)">
    <button type="button" class="chip" id="test" style="margin-top:8px">接続テスト</button>
    <div id="conn" aria-live="polite"></div>
  </div>
  <div class="panel">
    <div class="ref">
      <div class="drop" id="d2" tabindex="0" title="画像2(任意)"><span>画像2<br>＋</span><input type="file" accept="image/*"></div>
      <small>画像2(任意・参照画像)。なくてもプロンプトだけで生成できます</small>
    </div>
    <textarea id="pos" placeholder="プロンプト 例: 画像1のソファを画像2のソファに置き換える"></textarea>
    <div id="markinfo" aria-live="polite">赤マークあり — マーク部分のみ編集します</div>
    <button class="go" id="go" type="button">生成する</button>
    <div id="status" aria-live="polite"></div>
  </div>
</div>

    "inputs": {
      "value": "# Edit Prompt Enhancer — General (v2, 精简版)\n\n**FIRST — there are TWO separate language decisions. Do NOT conflate them.**\n\n**(A) Language of the rewritten prompt's DESCRIPTIVE prose — every word OUTSIDE double quotes (the description you write for the diffusion model, NOT the text painted into the image). This decision is final and non-negotiable:**\n- User instruction is in Chinese → write the description in Chinese.\n- User instruction is in English → write the description in English.\n- User instruction is in ANY other language (Japanese, Korean, French, Spanish, Thai, etc.) → write the description in English.\n\n**(B) Language of the TEXT THAT WILL BE RENDERED INTO THE OUTPUT IMAGE — the content INSIDE double quotes. Decide it in this strict priority order:**\n1. If the user's instruction gives the exact text to write, OR names a target language for the text (e.g. \"改成'夏日特惠'\", \"把标题写成英文\", \"add a Japanese title\", \"write the caption in Thai\") → render exactly that text / in exactly that specified language.\n2. Otherwise, if the input image already contains text → render in the DOMINANT language of the image's existing text — even when the instruction is written in a different language.\n3. Otherwise (the image contains no text AND the instruction names no target language) → render in the language of the user's instruction itself — including Japanese, Korean, Thai, Arabic, French, etc. Do NOT force it to English.\nWorked example: image is mostly Thai, instruction is in English asking to add/redesign a title without giving the exact words or a language → the rendered (quoted) text must be **Thai** (the image's dominant language), while the surrounding description (A) is still written in English.\n\nTwo reinforcements on decision (B): all rendered (quoted) text must be **monolingual** — do not mix Chinese and English inside the quotes and do not emit a bilingual pair unless the user explicitly asks for one. And **genre never overrides input language**: a \"spec sheet / cinematic data-document / storyboard / technical parameter\" look is achieved through layout and typography, NOT by switching rendered labels to English — every header, label, and caption stays in the decided language (standardized units and user-given proper nouns may remain Latin).\n\nYou are an expert at clarifying image editing instructions. Given a user's vague or ambiguous edit instruction and the input image(s), rewrite it into a precise, unambiguous, actionable editing directive. An input image is ALWAYS present — this is always an image-editing task, never text-to-image from nothing.\n\n## Core Objective\n\nRewrite the instruction so a downstream image-editing model can execute it without guessing — anchored on what the input image(s) actually show, faithful to the user's intent, inventing nothing.\n\n**How much you build is intent-branched.** When the user wants *this picture changed* (a local object/attribute/background edit, a text or UI edit, a quality or style change, a viewpoint/canvas transform), clarify and constrain: say exactly what changes, and let everything else stand. When the user wants *a new picture of this subject* (placing a subject in a new scene, compositing across images, a photo-shoot or poster or infographic built from a reference), construct actively: design the scene, lighting, composition and layout to a professional standard. Scale the elaboration to what was asked — a plain placement stays restrained, a styled shoot or a publication-grade poster is built out fully.\n\n## The Governing Principle — Attribute Disentanglement at Full Strength\n\n**Edit exactly the attribute(s) the user named, push each to a strong and unmistakable degree, and hold everything else at input fidelity.**\n\nBoth halves matter, and the two failure modes are symmetric:\n\n- **Leakage** — touching what the user did not name (a sharpen that re-grades color, an upscale that reframes, a style change that drifts a face, an outfit swap that drops an accessory, a background change that \"helpfully\" cleans up something unmentioned).\n- **Under-editing** — an output a viewer could mistake for the unedited input, because the requested change was applied faintly.\n\nPreservation locks **content, never edit strength**. Recognizability is bought by naming what stays fixed, not by holding the effect back.\n\n## What to Anchor, What to Decide\n\n**Anchor on the image.** Every spatial, tonal and contextual claim comes from what is visibly there. If you are unsure a detail exists, leave it out — a preserved element described at a higher level of abstraction is always safer than an invented specific.\n\n**Say what stays, without repainting it.** Name the untargeted content by type, position and role rather than describing its appearance, and prefer one blanket preservation clause over walking the frame. A preservation description reads to the model as a generation instruction: the more concretely you describe something you meant to keep, the more likely it drifts. Describe appearance concretely only for what you are actually changing, or when it is the only way to disambiguate between similar objects.\n\n**Identity is the hardest invariant.** A person's facial identity and the personal accessories that make them recognizable; a product's exact design, markings and count; and the input's rendering medium (photograph, anime, illustration, sketch, 3D render, painting) all survive every edit unless the user explicitly targets them. When identity comes from a reference image, point at that image rather than describing features in words — verbal descriptions make the model regenerate and degrade the likeness.\n\n**Resolve ambiguity, then commit.** Turn vague intent, imprecise spatial reference and unparameterized style words into something concrete and observable. Translate abstract quality language into the visual properties it implies. Where the instruction offers alternatives or contradicts itself, pick the }));
async function composeMarked(){
  const c = document.createElement('canvas'); c.width = paint.width; c.height = paint.height;
  const x = c.getContext('2d'); x.drawImage($('#cap'), 0, 0, c.width, c.height); x.drawImage(paint, 0, 0);
  const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.95));
  if(!b) throw new Error('マーク付き画像の作成に失敗しました。');
  return new File([b], 'marked.jpg', {type:'image/jpeg'});
}

// ================= 履歴(IndexedDB) =================
const MAX_HIST = 50;
let dbp = null;
function idb(){
  if(dbp) return dbp;
  dbp = new Promise((res, rej) => {
    try{
      if(!window.indexedDB) return rej(new Error('no idb'));
      const q = indexedDB.open('ai_history', 1);
      q.onupgradeneeded = () => { const s = q.result.createObjectStore('items', {keyPath:'id'}); s.createIndex('ts', 'ts'); };
      q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); q.onblocked = () => rej(new Error('blocked'));
    }catch(e){ rej(e); }
  });
  return dbp;
}
const tx = (mode, fn) => idb().then(db => new Promise((res, rej) => {
  const t = db.transaction('items', mode); let rq;
  try{ rq = fn(t.objectStore('items')); }catch(e){ rej(e); return; }
  t.oncomplete = () => res(rq && 'result' in rq ? rq.result : undefined);
  t.onerror = ev => rej(ev.target && ev.target.error); t.onabort = () => rej(t.error || new Error('abort'));
}));
async function makeThumb(blob){
  const bm = await createImageBitmap(blob), k = Math.min(1, 160/Math.max(bm.width, bm.height));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bm.width*k)); c.height = Math.max(1, Math.round(bm.height*k));
  c.getContext('2d').drawImage(bm, 0, 0, c.width, c.height); if(bm.close) bm.close();
  return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.8));
}
function renderHist(){
  const list = $('#hlist'); list.textContent = '';
  for(const it of hist){
    const d = document.createElement('div'); d.className = 'hi' + (it.id === activeId ? ' act' : ''); d.title = it.prompt;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'ht'; b.setAttribute('aria-label', '履歴を開く: ' + it.prompt.slice(0, 30));
    const im = new Image(); im.alt = ''; im.loading = 'lazy'; im.decoding = 'async'; im.src = it.turl; b.append(im);
    b.onclick = () => openHist(it);
    const x = document.createElement('button'); x.type = 'button'; x.className = 'hx'; x.textContent = '×'; x.setAttribute('aria-label', 'この履歴を削除');
    x.onclick = ev => { ev.stopPropagation(); delHist(it.id); };
    d.append(b, x); list.append(d);
  }
  $('#hempty').style.display = hist.length ? 'none' : 'block';
  $('#hclr').style.display = hist.length ? '' : 'none';
  hero.classList.toggle('hopen', histOK && histOpen);
  $('#hbtn').style.display = histOK ? '' : 'none';
  $('#hbtn').setAttribute('aria-pressed', histOK && histOpen);
}
function openHist(it){
  showCompare(it.result, it.name, it.original, it.id);
}
async function delHist(id){
  try{ await tx('readwrite', s => s.delete(id)); }catch(e){}
  const i = hist.findIndex(h => h.id === id);
  if(i >= 0){ URL.revokeObjectURL(hist[i].turl); hist.splice(i, 1); }
  renderHist();
}
$('#hclr').onclick = async () => {
  if(!confirm('履歴をすべて削除しますか?')) return;
  try{ await tx('readwrite', s => s.clear()); }catch(e){}
  hist.forEach(h => URL.revokeObjectURL(h.turl)); hist = []; renderHist();
};
$('#hbtn').onclick = () => { histOpen = !histOpen; renderHist(); };
async function dropOldest(){ if(hist.length) await delHist(hist[hist.length-1].id); }
async function saveHistory(rec){
  if(!histOK) return;
  try{
    rec.thumb = await makeThumb(rec.result);
    const row = {id:rec.id, ts:rec.ts, prompt:rec.prompt, thumb:rec.thumb, result:rec.result, original:rec.original, name:rec.name};
    try{ await tx('readwrite', s => s.put(row)); }
    catch(e){
      if(e && e.name === 'QuotaExceededError'){
        await dropOldest();
        try{ await tx('readwrite', s => s.put(row)); }
        catch(e2){ setStatus('履歴を保存できませんでした(容量不足)。生成結果は表示されています。', true); return; }
      }else return;
    }
    hist.unshift({...row, turl:URL.createObjectURL(row.thumb)});
    while(hist.length > MAX_HIST) await dropOldest();
    if(innerWidth >= 860) histOpen = true;
    renderHist();
  }catch(e){ /* 履歴が失敗しても生成には影響させない */ }
}
async function loadHist(){
  try{
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    const rows = await tx('readonly', s => s.getAll());
    rows.sort((a, b) => b.ts - a.ts);
    hist = rows.map(r => ({...r, turl:URL.createObjectURL(r.thumb)}));
    histOpen = innerWidth >= 860 && hist.length > 0;
  }catch(e){ histOK = false; }
  renderHist();
}
loadHist();

// ================= 結果を画像1にする =================
$('#use').onclick = () => {
  if(!curCmp) return;
  const b = curCmp.blob;
  setImg1(new File([b], curCmp.name || 'result.png', {type:b.type || 'image/png'}));
  panel.classList.remove('hide'); syncPanel(); setStatus('');
};

// ================= 生成 =================
$('#go').onclick = async () => {
  const btn = $('#go');
  const prompt = $('#pos').value.trim();
  if(!files[1]) return setStatus('画像1(360キャプチャ)がありません。「画像を変更」で選んでください。', true);
  if(!prompt) return setStatus('プロンプトを入力してください。', true);
  btn.disabled = true;
  const t0 = Date.now(), orig = files[1];
  startProg();
  try{
    // 赤マークがあれば合成画像を画像1として送る(元画像はorigとして清潔なまま保持)
    let src1 = orig, sendPrompt = prompt;
    if(hasMarks()){
      src1 = await composeMarked();
      sendPrompt = prompt.replace(/[\s.。!！]+$/, '') + '. Only edit the areas marked in red in image 1. Remove the red marks completely in the result. Keep everything else unchanged.';
    }
    setStatus('画像をアップロード中…');
    const [n1, n2] = await Promise.all([upload(src1), files[2] ? upload(files[2]) : null]);
    const wf = structuredClone(WORKFLOW);
    wf[NODE.img1].inputs.image = n1;
    if(n2){
      wf[NODE.img2].inputs.image = n2;
    }else{
      // 画像2なし: Load Image 2 を外し、それを参照する入力を削除(プロンプトのみで画像1を編集)
      for(const n of Object.values(wf))
        for(const [k,v] of Object.entries(n.inputs))
          if(Array.isArray(v) && v[0] === NODE.img2) delete n.inputs[k];
      delete wf[NODE.img2];
    }
    wf[NODE.enc].inputs.prompt = sendPrompt;
    wf[NODE.enc].inputs.negative_prompt = '';
    wf[NODE.sampler].inputs.seed = Math.floor(Math.random()*1e15);
    setStatus('ComfyUIに送信中…'); setStage('キューに送信中…');
    const r = await fetch(base()+'/prompt', {method:'POST', headers:hdr({'Content-Type':'application/json'}),
      body: JSON.stringify({prompt: wf, client_id: 'web-'+Date.now()})});
    const j = await r.json().catch(()=>({}));
    if(r.status===401) throw new Error('アクセスキーが違います。');
    if(!r.ok){
      const ne = j.node_errors ? Object.values(j.node_errors).map(n=>n.errors.map(e=>e.message+(e.details?': '+e.details:'')).join('; ')).join(' | ') : '';
      throw new Error((j.error && j.error.message || 'ワークフローが拒否されました') + (ne?' - '+ne:''));
    }
    const id = j.prompt_id;
    setStage('生成中…');
    for(;;){
      await sleep(1200);
      setStatus('生成中… '+Math.round((Date.now()-t0)/1000)+' 秒');
      const h = await (await fetch(base()+'/history/'+id, {headers:hdr()})).json();
      const e = h[id];
      if(!e) continue;
      if(e.status && e.status.status_str === 'error') throw new Error('ComfyUIで実行エラーが発生しました。ログを確認してください。');
      if(e.outputs && Object.keys(e.outputs).length){
        let imgs = (e.outputs[NODE.save] || {}).images;
        if(!imgs) for(const o of Object.values(e.outputs)){ if(o.images && o.images.some(i=>i.type==='output')){imgs=o.images.filter(i=>i.type==='output');break;} }
        if(!imgs || !imgs.length) throw new Error('完了しましたが、結果画像がありません。');
        const i = imgs[0];
        const url = base()+'/view?filename='+encodeURIComponent(i.filename)+'&subfolder='+encodeURIComponent(i.subfolder||'')+'&type='+i.type;
        const blob = await (await fetch(url, {headers:hdr()})).blob();
        const dur = Date.now()-t0; learnDuration(dur);
        finishProg(); await sleep(400); stopProg();
        const hid = Date.now().toString(36)+Math.random().toString(36).slice(2,6);
        showCompare(blob, i.filename, orig, hid);
        setStatus(Math.round(dur/1000)+' 秒で完了しました。');
        saveHistory({id:hid, ts:Date.now(), prompt, name:i.filename, result:blob, original:orig});
        break;
      }
    }
  }catch(err){
    setStatus(err.message.includes('Failed to fetch') ? 'PCに接続できません。'+mixedHint()+' 「接続設定」から接続テストを行ってください。' : err.message, true);
  }finally{ stopProg(); btn.disabled = false; }
};
